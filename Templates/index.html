<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Signup Portal</title>
    <style>
        :root {
            --bg-start: #1f2937;
            --bg-end: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --card-bg: rgba(30, 41, 59, 0.9);
            --primary: #7dd3fc;
            --accent: #a7f3d0;
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --border: rgba(148, 163, 184, 0.3);
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            font-family: Arial, sans-serif;
            color: var(--text);
            padding: 24px;
        }

        .page-shell {
            width: min(980px, 100%);
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: rgba(125, 211, 252, 0.15);
            color: var(--primary);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: bold;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            margin: 18px 0 10px;
        }

        .hero p {
            color: var(--muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 28px;
            backdrop-filter: blur(8px);
        }

        .signup-panel h2,
        .info-panel h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.6rem;
        }

        fieldset {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            margin: 0;
        }

        legend {
            padding: 0 8px;
            color: var(--accent);
            font-weight: bold;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.7);
            color: var(--text);
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid rgba(125, 211, 252, 0.7);
            border-color: transparent;
        }

        .primary-btn,
        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary), #38bdf8);
            color: #082f49;
        }

        .secondary-btn {
            background: rgba(167, 243, 208, 0.12);
            border: 1px solid rgba(167, 243, 208, 0.4);
            color: var(--accent);
            margin-top: 18px;
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        .info-panel ul {
            margin: 0;
            padding-left: 20px;
            color: var(--muted);
            line-height: 1.8;
        }

        @media (max-width: 700px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 22px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <span class="badge">Flask Signup Portal</span>
            <h1>Welcome aboard</h1>
            <p>Hi, welcome to this signup page!!</p>
        </header>

        <main class="content-grid">
            <section class="panel signup-panel" aria-labelledby="signup-title">
                <h2 id="signup-title">Create your profile</h2>
                <form action="{{ url_for('info') }}" method="post">
                    <fieldset>
                        <legend>Personal details</legend>

                        <div class="field">
                            <label for="name">Enter your name:</label>
                            <input type="text" id="name" name="name" placeholder="Your name" required>
                        </div>

                        <div class="field">
                            <label for="email">Email address:</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com">
                        </div>

                        <button class="primary-btn" type="submit">Submit</button>
                    </fieldset>
                </form>
            </section>

            <aside class="panel info-panel" aria-labelledby="features-title">
                <h2 id="features-title">Why join?</h2>
                <ul>
                    <li>Quick and easy profile signup.</li>
                    <li>Clean and responsive design.</li>
                    <li>Track submitted user information.</li>
                    <li>View the stored data in one click.</li>
                </ul>
                <a class="secondary-btn" href="{{ url_for('api') }}">See data</a>
            </aside>
        </main>
    </div>
</body>
</html>
