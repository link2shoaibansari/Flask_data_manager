<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
</head>
<body>
<p>Hi, Welcome to this signup page!!</p>
<form action="{{ url_for('info') }}" method="post">
    <label for="name">Enter your name:</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>
    <button type="submit">Submit</button>
</form>
<p><a class="button" href="{{ url_for('history') }}">See data</a></p>
<p>Today is {{ day }}</p>
<p>Current time is {{ current_time }}</p>
</body>
<style>
    body {
        background-color: #570404;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
    }
    p {
        font-size: 24px;
        color: #b0e591;
    }
</style>
</html>
